name: bitcoin-block-archive

# One persistent mainnet Bitcoin Core node plus an on-demand archive pass.
# `archiver` shares only the read-only node datadir and speaks to bitcoind over
# the private Compose network with Core's cookie authentication.
services:
  bitcoin-core:
    image: bitcoin/bitcoin:29.1-alpine
    environment:
      BITCOIN_DATA: /bitcoin
      # The image applies these IDs when it owns the datadir. Keeping the
      # default at 0 preserves its original internal bitcoin:bitcoin IDs.
      # Set them to the host owner's IDs for a bind-mounted host disk.
      UID: ${BITCOIN_DATA_UID:-0}
      GID: ${BITCOIN_DATA_GID:-0}
    command:
      - -server=1
      # No pruning and a txindex by default, so a first Dumplings scan can check
      # its tx0 candidate rule. Manual pruning by the archiver (1) needs
      # BITCOIN_TXINDEX=0, because Core refuses txindex with any pruning.
      - -prune=${BITCOIN_PRUNE:-0}
      - -txindex=${BITCOIN_TXINDEX:-1}
      - -rpcworkqueue=${BITCOIN_RPC_WORK_QUEUE:-16}
      - -dbcache=${BITCOIN_DBCACHE:-4096}
      - -blocksxor=0
      - -listen=0
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -printtoconsole
    volumes:
      # Defaults to Docker's named `bitcoin-data` volume. Set
      # BITCOIN_DATA_SOURCE=/mnt/bitcoin-data to use a mounted host disk.
      - ${BITCOIN_DATA_SOURCE:-bitcoin-data}:/bitcoin
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -datadir=/bitcoin getblockchaininfo >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    stop_grace_period: 5m

  archiver:
    profiles: ["archive"]
    image: ${ARCHIVER_IMAGE:-ghcr.io/ondrejman/bitcoin-block-archive:latest}
    # Core's datadir is mode 700 and its cookie 600, so read them as their
    # owner: the Core image's `bitcoin` user (100:101) or BITCOIN_DATA_UID/GID.
    user: "${BITCOIN_DATA_UID:-100}:${BITCOIN_DATA_GID:-101}"
    depends_on:
      bitcoin-core:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.cl4.du.cesnet.cz}
      S3_DESTINATION: ${S3_DESTINATION:-s3://xman-coinjoin-new/bitcoin-mainnet/blocks}
      S3_PROFILE: ${S3_PROFILE:-coinjoin}
      BITCOIN_DATADIR: /bitcoin
      BITCOIN_RPC_HOST: bitcoin-core
      BITCOIN_RPC_PORT: "8332"
      # Seconds between passes, or 30m / 2h; 0 runs one pass and exits.
      ARCHIVE_INTERVAL: ${ARCHIVE_INTERVAL:-30m}
    volumes:
      - ${BITCOIN_DATA_SOURCE:-bitcoin-data}:/bitcoin:ro
      - archive-state:/state
      # Dumplings' progress, the prune ceiling of --prune-ceiling-file.
      - ${DUMPLINGS_DATA_SOURCE:-dumplings-data}:/dumplings:ro
    # ARCHIVER_ARGS replaces the default flags after the fixed paths and is
    # split like a shell command line.
    command: >-
      --block-dir /bitcoin/blocks --state-dir /state
      ${ARCHIVER_ARGS:---keep-latest-files 2}
    # SIGTERM ends the wait at once and otherwise lets the running pass finish.
    # A pass still running after the grace period is killed; the next pass
    # repeats its unverified uploads.
    init: true
    stop_grace_period: 10m
    restart: unless-stopped

  # Daily Dumplings scan of the same node, published to S3 as one latest
  # snapshot. On a pruned node it keeps the Whirlpool tx0s it needs itself,
  # and the archiver needs --prune-ceiling-file so that it never prunes a
  # block Dumplings has not scanned yet; see dumplings/README.md and
  # scenario-lab/mainnet-analysis-plan-v2.md §2.10.
  dumplings:
    profiles: ["dumplings"]
    image: ${DUMPLINGS_IMAGE:-ghcr.io/ondrejman/dumplings:latest}
    mem_limit: ${DUMPLINGS_MEMORY_LIMIT:-2g}
    memswap_limit: ${DUMPLINGS_MEMORY_LIMIT:-2g}
    user: "${BITCOIN_DATA_UID:-100}:${BITCOIN_DATA_GID:-101}"
    # Dumplings only talks to Core on localhost:8332.
    network_mode: service:bitcoin-core
    depends_on:
      bitcoin-core:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.cl4.du.cesnet.cz}
      DUMPLINGS_S3_DESTINATION: ${DUMPLINGS_S3_DESTINATION:-s3://xman-coinjoin-new/dumplings}
      DUMPLINGS_INTERVAL: ${DUMPLINGS_INTERVAL:-86400}
      BITCOIN_RPC_COOKIE: /bitcoin/.cookie
    volumes:
      - ${BITCOIN_DATA_SOURCE:-bitcoin-data}:/bitcoin:ro
      # Scanner/ grows to several GB; keep it off a nearly full block volume.
      - ${DUMPLINGS_DATA_SOURCE:-dumplings-data}:/data
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  bitcoin-data:
  archive-state:
  dumplings-data:
